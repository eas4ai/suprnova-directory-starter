[package]
name = "directory"
version = "1.0.0"
edition = "2024"
rust-version = "1.94.0"
description = "A directory starter kit by Suprnova"
authors = ["eas4ai <shawn.payments@gmail.com>"]

# Two binaries are declared below, so `cargo run` has to be told which
# one it means. Without `default-run` it refuses outright - it does NOT
# fall back to the binary sharing the package name - and every wrapper
# (`suprnova migrate`, `schedule:work`, `web:run`, …) fails before doing
# any work.
default-run = "directory"

[[bin]]
name = "directory"
path = "cmd/main.rs"

# Per-project console binary - runtime command dispatch (db:seed,
# user-defined `#[command]` async fns, etc.). Same crate, different
# `fn main` because console commands exit when their handler returns
# whereas the server binary loops forever.
[[bin]]
name = "console"
path = "src/bin/console.rs"

[dependencies]
suprnova-markdown = { git = "https://github.com/eas4ai/suprnova-markdown.git", rev = "9aa7a482782ddc6eef92393ab2b0f36a2fefb7ec" }
suprnova = { git = "https://github.com/eas4ai/suprnova.git", rev = "3229aa9af542c991196274fa3c235cdce88a68e2" }
suprnova-payments-stripe = { git = "https://github.com/eas4ai/suprnova.git", rev = "3229aa9af542c991196274fa3c235cdce88a68e2" }
suprnova-payments-paddle = { git = "https://github.com/eas4ai/suprnova.git", rev = "3229aa9af542c991196274fa3c235cdce88a68e2" }
tokio = { version = "1", features = ["full"] }
sea-orm-migration = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls"] }
sea-orm = { version = "2.0", features = ["sqlx-sqlite", "sqlx-postgres", "runtime-tokio-native-tls", "macros", "with-chrono", "postgres-use-serial-pk"] }
serde = { version = "1.0", features = ["derive"] }
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
validator = { version = "0.20", features = ["derive"] }
tracing = "0.1"
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
uuid = { version = "1", features = ["v4"] }
url = "2"
http = "1"
stripe = { package = "async-stripe", version = "=1.0.0-rc.5", default-features = false, features = ["rustls-tls-webpki-roots", "rustls-ring"] }
stripe-client-core = { package = "async-stripe-client-core", version = "=1.0.0-rc.5" }
stripe-shared = { package = "async-stripe-shared", version = "=1.0.0-rc.5", features = ["serialize"] }
stripe-types = { package = "async-stripe-types", version = "=1.0.0-rc.8" }
paddle-rust-sdk = { version = "=0.18.0", default-features = false, features = ["rustls-webpki-roots"] }

[dev-dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
hmac = "0.12"
sha2 = "0.10"
